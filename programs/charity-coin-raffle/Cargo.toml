[package]
name = "charity_coin_raffle"
version = "0.1.0"
description = "Charity Coin Raffle Program (Native Solana)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "charity_coin_raffle"
path = "src/lib.rs"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[dependencies]
solana-program = "~1.18"
borsh = "1.5"

